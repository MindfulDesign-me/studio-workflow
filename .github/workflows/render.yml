# MindfulStudio's render workflow (server/lib/render.js, workflow/RENDER.md): makes a round's
# screenshots and its PDF, Word and PowerPoint downloads again after the round was changed inside
# Studio (the assistant, the hand editor) and has no repository of its own to do it.
#
# Studio starts it, as the MindfulStudio GitHub App, in one private repository whose workflow is these
# few lines (workflow/render-repo/.github/workflows/render.yml):
#
#   on: { workflow_dispatch: { inputs: { ticket: { required: true }, round: { required: true } } } }
#   jobs:
#     render:
#       uses: MindfulDesign-me/studio-workflow/.github/workflows/render.yml@v2
#       permissions: { contents: read, id-token: write }
#       with: { ticket: "${{ inputs.ticket }}", round: "${{ inputs.round }}" }
#
# Studio trusts only this file at the pinned tag, running in that one repository (the OIDC claims
# job_workflow_ref and repository), and only with a ticket it gave for one save. The same jobs and the
# same rule as upload.yml, with "fetch" where that has "build": designer code never runs where the
# token can be asked for.
#   fetch   asks Studio for that save's files. Has the token; runs only this repo's pinned code.
#   shots   renders the pages for screenshots and downloads (runs the designs' JavaScript). No token.
#   exports builds the PDF and PowerPoint downloads from what shots printed (untrusted input). No token.
#   studio  runs only this repo's pinned code, with Node and no packages: checks, upload. Has the token.
#   report  tells Studio when any of them failed.
# Actions are pinned to commit SHAs (v4 releases), as in upload.yml.
name: MindfulStudio render

on:
  workflow_call:
    inputs:
      ticket: { required: true, type: string }
      round: { required: true, type: string }

permissions:
  contents: read

env:
  STUDIO_URL: https://studio.mindfuldesign.me

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      go: ${{ steps.fetch.outputs.go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MindfulDesign-me/studio-workflow, ref: v2, path: .studio, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Fetch the save to render
        id: fetch
        env: { STUDIO_RENDER_TICKET: "${{ inputs.ticket }}" }
        run: |
          echo "::add-mask::$STUDIO_RENDER_TICKET"
          node .studio/scripts/render-fetch.mjs render
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.fetch.outputs.go == 'yes'
        with: { name: render, path: render, retention-days: 1, if-no-files-found: error }

  shots:
    needs: fetch
    if: needs.fetch.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true   # as in upload.yml; a render that made nothing is refused by Studio and said on the round
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MindfulDesign-me/studio-workflow, ref: v2, path: .studio, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: render, path: render }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --prefix .studio --ignore-scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ hashFiles('.studio/package-lock.json') }}" }
      - run: npx --prefix .studio playwright install --with-deps chromium
      - name: Screenshots
        run: mkdir -p shots && (node .studio/scripts/shots.mjs render/studio.json render/dist shots > shots/screenshots.json || echo '[]' > shots/screenshots.json)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: shots, path: shots, retention-days: 1 }
      - name: Downloads, pages
        continue-on-error: true
        run: node .studio/scripts/exports.mjs render/studio.json render/dist exports-src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: exports-src, path: exports-src, retention-days: 1, if-no-files-found: ignore }

  # Builds the files from what the shots job printed, which is untrusted (assemble.mjs checks every
  # file). No token here, no designs' code: the only job with packages, as in upload.yml.
  exports:
    needs: [fetch, shots]
    if: ${{ !cancelled() && needs.fetch.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MindfulDesign-me/studio-workflow, ref: v2, path: .studio, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: render, path: render }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: { name: exports-src, path: exports-src }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --prefix .studio --ignore-scripts
      - name: Downloads, files
        run: node .studio/scripts/assemble.mjs render/studio.json exports-src exports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: exports, path: exports, retention-days: 1, if-no-files-found: ignore }

  studio:
    needs: [fetch, shots, exports]
    if: ${{ !cancelled() && needs.fetch.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MindfulDesign-me/studio-workflow, ref: v2, path: .studio, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: render, path: render }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: { name: shots, path: shots }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: { name: exports, path: exports }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Checks
        run: node .studio/scripts/check.mjs render/studio.json render/dist render/dist > checks.json
      - name: Upload to MindfulStudio
        env:
          STUDIO_RENDER_TICKET: "${{ inputs.ticket }}"
          COMMIT_MESSAGE: "Rendered again after a change in Studio"
        run: |
          echo "::add-mask::$STUDIO_RENDER_TICKET"
          node .studio/scripts/upload.mjs render/studio.json render/dist checks.json shots/screenshots.json exports/exports.json

  report:
    needs: [fetch, shots, studio]
    if: failure() && needs.fetch.outputs.go != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: MindfulDesign-me/studio-workflow, ref: v2, path: .studio, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Tell Studio it failed
        env:
          STUDIO_RENDER_TICKET: "${{ inputs.ticket }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEP: "${{ needs.fetch.result != 'success' && 'fetching the files' || 'the render' }}"
        run: node .studio/scripts/report-failure.mjs
